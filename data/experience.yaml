- company: Uber
  team: Identity Platform (Core Services)
  role: Senior Software Engineer
  start: Sep 2025
  end: Present
  current: true
  location: São Paulo, SP
  accent: green
  summary: >-
    Device Identity for non-human accounts (autonomous vehicles, in-car tablets and
    service accounts), architecting secure authentication and authorization systems
    and device operational infrastructure at scale. My team owns the path end to end: the
    identity services themselves, the client SDKs that devices integrate against, and
    the web surface for device login, provisioning and management.
  surfaces_label: Surface area
  surfaces:
    - name: Backend
      note: Identity services, APIs, authorization
      lead: true
    - name: Android SDK
      note: Primary device integration surface
      lead: true
    - name: Web
      note: Device login, provisioning, management
      lead: true
    - name: iOS SDK
      note: Platform parity
  highlights:
    - Architected cryptographic authentication for autonomous vehicle tablets (on-device key generation, device-signed JWTs, SHA-256 SPKI fingerprint validation) and device lifecycle management supporting multiple tablet types without disruption, establishing a Zero Trust model and reusable patterns for other device types.
    - Built and maintain the client SDKs, Android first with iOS at parity, that let partner apps provision, attest and authenticate devices without reimplementing the identity protocol themselves.
    - Implemented fine-grained authorization for OAuth endpoints and mentored engineers across geos on security patterns.
    - Built a reusable device observability framework spanning four domains (authentication, device lifecycle, external dependencies and security), enabling faster device rollouts through metrics instrumentation, error categorization and operational dashboards.
    - Founding on-call member within two months of joining; built test automation infrastructure and designed an AI-driven on-call assistant using MCP.
  stack: [Go, Java, Kotlin, Swift, TypeScript, gRPC, OAuth 2.0, Zero Trust, Kubernetes]

