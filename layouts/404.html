{{ define "main" }}
<section class="hero" style="min-height:70svh">
  <div class="hero-grid" aria-hidden="true"></div>
  <div class="hero-glow one" aria-hidden="true"></div>
  <div class="shell">
    <p class="hero-eyebrow"><span class="chip-live" style="color:var(--red);border-color:rgba(255,85,85,.35);background:rgba(255,85,85,.08)">404</span> route not found</p>
    <h1 style="font-size:var(--step-3)">This page doesn't exist.</h1>
    <p class="hero-tagline">The link may be stale, or the page was removed in the rebuild.</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="{{ "/" | relURL }}">Back home</a>
      <button class="btn" type="button" data-cmdk-open>Search the site <kbd>⌘K</kbd></button>
    </div>
  </div>
</section>
{{ end }}
